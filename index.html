<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>경원엔터프라이즈 홈페이지 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F9;--fg:#13212B;--muted:#5A6A76;--line:#D4DDE3;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(40px,6vw,72px) max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.eb{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:var(--muted)}
h1{font-size:clamp(26px,3.6vw,38px);font-weight:300;letter-spacing:-.02em;margin:8px 0 10px}
h1 b{font-weight:700}
.lead{color:var(--muted);margin:0 0 36px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.c{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.sw{height:150px;background:center/cover url(img/hero.jpg);position:relative}
.sw::after{content:'';position:absolute;inset:0;background:var(--ov)}
.sw i{position:absolute;left:18px;bottom:16px;z-index:1;width:44px;height:6px;border-radius:3px;background:var(--ac)}
.c div.b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.c h2{font-size:19px;margin:0}
.c p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.ln{display:flex;gap:8px;margin-top:auto}
.ln a{flex:1;text-align:center;text-decoration:none;font-weight:500;font-size:14.5px;padding:10px 12px;border-radius:999px;border:1px solid var(--line);color:var(--fg)}
.ln a:first-child{background:var(--ac);border-color:var(--ac);color:#fff}
.ln a:hover{border-color:var(--fg)}
.note{margin-top:32px;font-size:13px;color:var(--muted)}
</style></head><body>
<div class="wrap">
<p class="eb">KYUNGWON ENTERPRISE · PREVIEW</p>
<h1>경원엔터프라이즈 <b>홈페이지 시안</b></h1>
<p class="lead">검토용 임시 페이지입니다. 세 가지 색상 시안을 각각 한국어와 영문으로 보실 수 있습니다.</p>
<div class="grid">
 <div class="c" style="--ac:#0A7E99;--ov:linear-gradient(90deg,rgba(6,17,25,.85),rgba(6,17,25,.3))"><div class="sw"><i></i></div><div class="b"><h2>청록</h2><p>어두운 대문, 물과 전해의 깨끗한 느낌</p><div class="ln"><a href="teal/">한국어</a><a href="teal/en/">English</a></div></div></div>
 <div class="c" style="--ac:#2A47C8;--ov:linear-gradient(90deg,rgba(14,16,24,.88),rgba(14,16,24,.3))"><div class="sw"><i></i></div><div class="b"><h2>그래파이트·코발트</h2><p>회색 톤에 진한 파랑, 차분한 기술 기업 인상</p><div class="ln"><a href="cobalt/">한국어</a><a href="cobalt/en/">English</a></div></div></div>
 <div class="c" style="--ac:#B35C00;--ov:linear-gradient(90deg,rgba(255,255,255,.9),rgba(255,255,255,.2))"><div class="sw"><i></i></div><div class="b"><h2>흰 바탕 앰버</h2><p>흰 바탕, 네이비 글자, 따뜻한 호박색 포인트</p><div class="ln"><a href="amber/">한국어</a><a href="amber/en/">English</a></div></div></div>
</div>
<p class="note">사진은 Unsplash 제공 이미지이며, 협력사 로고·소식·연혁 일부는 구성을 보여주기 위한 샘플입니다.</p>
</div></body></html>
