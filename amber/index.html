<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#FFFFFF;color:#000000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>경원엔터프라이즈 White Amber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Sans:wght@200;300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: dark electrolysis motion hero, then airy editorial bands — hairlines, image/text rows and timelines instead of box grids. One card per page at most. */
:root{
  --bg:#F8F8F7; --band:#F0F0EF; --fg:#211F1D; --muted:#6B6965; --line:#DDDCDA; --line-2:#CBC9C7;
  --forest:#995B0A; --forest-2:#814D08; --mist:#D87A00; --on-forest:#F8F7F6; --ink:#181613; --on-ink:#EEEDEB; --ink-muted:#A6A4A0;
  --card:#FFFFFF; --lb:#3C3A36; --focus:#995B0A;
  --f-sans:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-lat:'IBM Plex Sans','Noto Sans KR',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151413; --band:#1D1C1A; --fg:#EDECEA; --muted:#A8A6A3; --line:#33312D; --line-2:#403E3B;
  --forest:#DF9A3F; --forest-2:#EAB36A; --mist:#DF9A3F; --on-forest:#12100E; --ink:#100F0E; --on-ink:#EEEDEB; --ink-muted:#A3A09C;
  --card:#211F1D; --lb:#64605B; --focus:#EAB36A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151413; --band:#1D1C1A; --fg:#EDECEA; --muted:#A8A6A3; --line:#33312D; --line-2:#403E3B;
  --forest:#DF9A3F; --forest-2:#EAB36A; --mist:#DF9A3F; --on-forest:#12100E; --ink:#100F0E; --on-ink:#EEEDEB; --ink-muted:#A3A09C;
  --card:#211F1D; --lb:#64605B; --focus:#EAB36A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:16px;line-height:1.75;margin:0;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-sans);line-height:1.3;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.band{background:var(--band)}
section.s{padding-block:clamp(64px,8vw,104px)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--forest);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:1px;background:currentColor}
h2.t{font-size:clamp(26px,3.6vw,40px);font-weight:300;letter-spacing:-.02em;margin-bottom:18px}
h2.t b{font-weight:700}
.lead{color:var(--muted);max-width:60ch;margin:0 0 40px;font-size:17px}
.sh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 64px;align-items:end;margin-bottom:48px}
.sh .lead{margin:0}
@media (max-width:860px){.sh{grid-template-columns:1fr}}
.arrow{display:inline-block;transition:transform .2s}
a:hover .arrow{transform:translateX(4px)}

/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);min-width:0}
.brand svg{width:38px;height:42px;flex:none;display:block}
.brand .wm{display:inline-grid;line-height:1}
.brand .wm b{font-family:var(--f-lat);font-weight:700;font-size:23px;line-height:1;letter-spacing:-.015em;color:var(--fg)}
.brand .wm i{display:block;font-style:normal;font-family:var(--f-lat);font-size:9.5px;font-weight:500;line-height:1;letter-spacing:0;word-spacing:0;text-align:justify;text-align-last:justify;color:var(--muted);margin-top:6px}
@media (max-width:560px){.brand svg{width:34px;height:38px}.brand .wm b{font-size:20px}.brand .wm i{font-size:8.5px;margin-top:5px}}
nav.main{margin-left:auto;display:flex;align-items:center;gap:2px}
nav.main a.nl{font-size:14.5px;padding:8px 12px;text-decoration:none;color:var(--fg);position:relative}
nav.main a.nl::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:var(--forest);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav.main a.nl:hover::after,nav.main a.on::after{transform:scaleX(1)}
nav.main a.on{color:var(--forest);font-weight:500}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;margin-left:10px}
.lang button{font:inherit;font-family:var(--f-mono);font-size:11.5px;padding:5px 11px;background:none;color:var(--muted);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:999px;width:44px;height:44px;color:var(--fg);cursor:pointer}
.drop{position:relative}
.dd{position:absolute;top:calc(100% + 10px);left:-12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;display:none;gap:28px;grid-template-columns:repeat(3,minmax(190px,1fr));width:min(760px,92vw);box-shadow:0 24px 60px -20px rgba(21,19,17,.28)}
.drop::after{content:'';position:absolute;left:0;right:0;top:100%;height:12px}
.drop:hover .dd,.drop:focus-within .dd{display:grid}
.dd h4{margin:0 0 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--forest);font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dd a{display:flex;gap:10px;padding:6px 0;font-size:14px;text-decoration:none;line-height:1.45}
.dd a span{font-family:var(--f-lat);color:var(--muted);font-size:12.5px;min-width:30px;padding-top:1px}
.dd a:hover{color:var(--forest)}
@media (max-width:920px){
  .burger{display:grid;place-items:center}
  nav.main{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:8px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));max-height:calc(100vh - 80px);overflow:auto}
  nav.main.open{display:flex}
  nav.main a.nl{padding:12px 0;border-bottom:1px solid var(--line)}
  nav.main a.nl::after{display:none}
  .lang{margin:14px 0 0;align-self:flex-start}
  .dd{position:static;display:grid;grid-template-columns:1fr;box-shadow:none;border:0;padding:4px 0 8px 12px;width:auto;gap:12px;background:none}
  .drop::after{display:none}
  nav.main .btn.f{margin:14px 0 0;align-self:flex-start}
}

/* hero */
.hero{position:relative;color:#F0EFEE;background:#11100E;overflow:hidden;isolation:isolate}
.hero canvas,.hero .poster{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.hero .poster{object-fit:cover}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(17,16,14,.92) 0%,rgba(17,16,14,.7) 38%,rgba(17,16,14,.05) 72%),linear-gradient(0deg,rgba(17,16,14,.6),rgba(17,16,14,0) 35%)}
.hero .in{padding-block:clamp(88px,12vw,168px) clamp(72px,8vw,112px);display:grid;gap:0}
.hero .eyebrow{color:#EABC7F}
.hero h1{font-size:clamp(34px,5.4vw,68px);font-weight:300;letter-spacing:-.035em;line-height:1.15;max-width:15ch;margin-bottom:26px}
.hero h1 em{font-style:normal;font-weight:700;color:#FFFFFF}
.hero p.sub{font-size:clamp(16px,1.5vw,18.5px);max-width:44ch;color:#C9C7C3;margin:0 0 38px}
.hero .meta{position:absolute;left:0;right:0;bottom:0;border-top:1px solid rgba(240,239,238,.14)}
.hero .meta .wrap{display:flex;align-items:center;gap:16px;min-height:52px;flex-wrap:wrap}
.hero .cap{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:#A5A29E;display:flex;gap:8px;align-items:center}
.hero .cap::before{content:'';width:6px;height:6px;border-radius:50%;background:#DF9A3F}
.vctl{margin-left:auto;background:none;color:#D6D4D2;border:1px solid rgba(240,239,238,.3);border-radius:999px;font:inherit;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:6px 14px;cursor:pointer;min-height:32px}
.vctl:hover{border-color:#F0EFEE;color:#FFFFFF}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:500;font-size:15px;padding:13px 24px;border-radius:999px;text-decoration:none;border:1px solid transparent;cursor:pointer;min-height:46px;transition:background .2s,border-color .2s,color .2s}
.btn.p{background:#F0EFEE;color:#141210}
.btn.p:hover{background:#FFFFFF}
.btn.g{border-color:rgba(240,239,238,.4);color:#F0EFEE}
.btn.g:hover{border-color:#F0EFEE;background:rgba(240,239,238,.08)}
.btn.f{background:var(--fg);color:var(--bg)}
.btn.f:hover{background:var(--forest);color:var(--on-forest)}
.btn.o{border-color:var(--line-2);color:var(--fg);background:none}
.btn.o:hover{border-color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:8px 18px;min-height:38px;font-size:14px}
nav.main .btn.f{margin-left:12px}
.notice{font-size:13px;color:var(--muted);max-width:80ch;margin:0}
.heronote{border-bottom:1px solid var(--line)}
.heronote .notice{padding-block:14px;font-size:12.5px}

/* pillars: alternating editorial rows */
.rows{display:grid;gap:clamp(56px,7vw,96px)}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.row:nth-child(even) .fig{order:2}
.fig{position:relative;margin:0}
.fig img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px}
.fig figcaption{position:absolute;left:16px;bottom:14px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:rgba(240,239,238,.75)}
.fig .lt{position:absolute;top:-18px;right:-10px;font-family:var(--f-lat);font-weight:200;font-size:clamp(90px,11vw,150px);line-height:1;color:var(--forest);opacity:.9;pointer-events:none}
.row:nth-child(even) .fig .lt{right:auto;left:-10px}
.txt .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--muted)}
.txt h3{font-size:clamp(24px,2.8vw,32px);font-weight:700;letter-spacing:-.02em;margin:8px 0 14px}
.txt>p{margin:0 0 26px;color:var(--muted);max-width:46ch}
.ilist{list-style:none;margin:0 0 24px;padding:0;border-top:1px solid var(--line)}
.ilist a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.ilist a b{font-family:var(--f-lat);font-weight:500;color:var(--forest);font-size:13px}
.ilist a i{font-style:normal;color:var(--muted)}
.ilist a:hover{color:var(--forest)}
.tlink{font-weight:500;color:var(--forest);text-decoration:none;font-size:14.5px}
.core{margin-top:clamp(56px,7vw,88px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding-top:28px;border-top:1px solid var(--line)}
.core svg{width:120px;height:56px}
.core p{margin:0;color:var(--muted);max-width:76ch}
.core b{color:var(--fg)}
@media (max-width:860px){.row{grid-template-columns:1fr}.row:nth-child(even) .fig{order:0}.core{grid-template-columns:1fr}}

/* finder */
.finder{display:grid;gap:20px}
.ftop{display:flex;gap:16px 24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{position:relative;flex:1 1 280px;max-width:440px}
.search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{border:0;border-bottom:1.5px solid var(--line-2);border-radius:0;background:none;padding:10px 0 10px 28px;font-size:16px}
.search input:focus{outline:none;border-bottom-color:var(--forest)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13.5px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--fg);cursor:pointer;min-height:34px}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fcnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));column-gap:40px;margin-top:4px}
.card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px;padding:22px 0 24px;border-top:1px solid var(--line-2);text-decoration:none;min-width:0;position:relative}
.card::before{content:'';position:absolute;left:0;top:-1px;height:1.5px;width:0;background:var(--forest);transition:width .35s}
.card:hover::before{width:100%}
.card .no{font-family:var(--f-lat);font-weight:200;font-size:28px;white-space:nowrap;line-height:1;color:var(--forest);grid-row:span 3}
.card h4{font-size:17px;font-weight:700;line-height:1.45}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.65}
.card .more{font-size:13px;color:var(--forest);font-weight:500;margin-top:6px}
.empty{padding:48px 24px;text-align:center;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* strengths */
.str{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.str div{padding:8px 32px 8px 0;margin-right:32px;border-right:1px solid var(--line)}
.str div:last-child{border-right:0;margin-right:0}
.str svg{width:40px;height:40px;color:var(--forest);margin-bottom:18px}
.str b{display:block;font-size:19px;margin-bottom:8px}
.str span{font-size:15px;color:var(--muted)}
@media (max-width:760px){.str{grid-template-columns:1fr;gap:28px}.str div{border-right:0;margin:0;padding:0 0 28px;border-bottom:1px solid var(--line)}.str div:last-child{border-bottom:0}}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.1fr);gap:0;position:relative}
.tl .yr{font-size:clamp(30px,3.2vw,42px)!important}
.tlnote{display:flex;gap:24px;align-items:center;margin:36px 0 0;flex-wrap:wrap}.tlnote>span{font-size:12.5px;color:var(--muted)}
@media (max-width:1100px) and (min-width:861px){.tl{grid-template-columns:repeat(3,minmax(0,1fr))}.tl .ev{padding-bottom:28px}.tl .big{grid-column:1/-1;border-left:0;border-top:1px solid var(--line-2);padding:20px 0 0}}
.tl .ev{position:relative;padding:34px 28px 0 0}
.tl .ev::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line-2)}
.tl .ev::after{content:'';position:absolute;top:-5px;left:0;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--forest)}
.band .tl .ev::after{background:var(--band)}
.tl .yr{font-family:var(--f-lat);font-weight:300;font-size:clamp(34px,4vw,48px);line-height:1;letter-spacing:-.02em;display:block;margin-bottom:12px;font-variant-numeric:tabular-nums}
.tl .ev span{color:var(--muted);font-size:15px}
.tl .big{padding:0 0 0 32px;border-left:1px solid var(--line-2);align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end}
.tl .big b{font-family:var(--f-lat);font-weight:200;font-size:clamp(72px,9vw,120px);line-height:.9;color:var(--forest)}
.tl .big span{color:var(--muted);font-size:15px;margin-top:10px}
@media (max-width:860px){.tl{grid-template-columns:1fr}.tl .ev{padding:0 0 28px 28px}.tl .ev::before{top:0;bottom:0;left:4px;right:auto;width:1px;height:auto}.tl .ev::after{top:4px;left:-1px}.tl .big{border-left:0;padding:20px 0 0;border-top:1px solid var(--line-2)}}

/* hub */
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px}
.hub a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:24px 0;border-top:1px solid var(--line-2);text-decoration:none;align-items:center}
.hub a:nth-last-child(-n+2){border-bottom:1px solid var(--line-2)}
.hub b{font-size:20px;font-weight:500}
.hub span{font-size:14.5px;color:var(--muted);grid-column:1}
.hub .arrow{grid-row:1/span 2;grid-column:2;font-size:22px;color:var(--forest)}
.hub a:hover b{color:var(--forest)}
@media (max-width:700px){.hub{grid-template-columns:1fr}.hub a:nth-last-child(2){border-bottom:0}}

/* cases */
.cases{display:grid}
.case{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:8px 32px;align-items:baseline;padding:26px 0;border-top:1px solid var(--line-2);text-decoration:none}
.case:last-child{border-bottom:1px solid var(--line-2)}
.case .yr{font-family:var(--f-lat);font-weight:300;font-size:40px;line-height:1;color:var(--forest);font-variant-numeric:tabular-nums}
.case p{margin:0;font-size:18px;font-weight:500}
.case small{color:var(--muted);font-size:13px;display:block;margin-top:6px;font-weight:400}
.case .arrow{color:var(--forest);font-size:20px}
.case:hover p{color:var(--forest)}
@media (max-width:700px){.case{grid-template-columns:1fr auto}.case .yr{grid-column:1/-1;font-size:32px}}

/* cta */
.ctaband{position:relative;color:#F0EFEE;background:#161412 url(../img/b_contact.jpg) center/cover;isolation:isolate}
.ctaband::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(17,16,14,.94),rgba(17,16,14,.6))}
.ctaband .wrap{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;padding-block:clamp(64px,8vw,96px)}
.ctaband p{margin:0;font-size:clamp(24px,3vw,34px);font-weight:300;letter-spacing:-.02em;max-width:22ch;line-height:1.35}
.ctaband .btn.o{border-color:rgba(240,239,238,.4);color:#F0EFEE}
.ctaband .btn.o:hover{border-color:#F0EFEE}

/* inner page header */
.ph{background:var(--band);border-bottom:1px solid var(--line);padding-block:56px 48px}
.ph h1{font-size:clamp(30px,4.4vw,52px);font-weight:300;letter-spacing:-.03em;max-width:22ch}
.ph .tag{color:var(--muted);font-size:18px;margin:16px 0 0;max-width:52ch}
.crumb{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 18px;letter-spacing:.04em}
.crumb a{color:inherit;text-decoration:none}
.crumb a:hover{color:var(--forest)}
.ph.on-img{background-size:cover;background-position:center right;color:#F0EFEE;border-bottom:0;padding-block:clamp(72px,9vw,120px) clamp(56px,7vw,88px)}
.ph.on-img h1,.ph.on-img .tag{color:#F0EFEE}
.ph.on-img .tag{color:#C9C7C3}
.ph.on-img .eyebrow{color:#EABC7F}
.ph.on-img .crumb,.ph.on-img .crumb a{color:#B1AEAA}

/* bright palette: amberwn */

<script>
const D={"ko": [{"tag": "전해 세정수로 세제 없이 씻고 빨래합니다.", "prob": ["세탁과 설거지에 쓰는 합성세제는 세정 뒤 폐수로 남아 환경 부담이 되고, 피부에 닿는 잔류 성분에 대한 걱정도 따릅니다. 경원엔터프라이즈는 수십 년의 전해 기술 연구를 바탕으로, 수돗물이나 지하수를 전기분해해 알칼리성 세정수로 바꾸는 장치를 개발했습니다. 이 세정수를 세제 대신 사용하면 합성세제 없이 세탁과 세척을 할 수 있습니다. 장치는 세탁기·식기세척기에 내장하거나, 기존 설비 밖에서 물을 만들어 공급하는 두 가지 방식으로 적용할 수 있습니다."], "how": ["다성분계 촉매 전극(DSA)과 직류 전원으로 물을 전기분해합니다.", "소량의 전해질(탄산나트륨)을 물에 더해 전해조를 통과시키면 알칼리성 세정수가 만들어집니다.", "이 세정수가 세제를 대신해 오염을 씻어 냅니다. 합성세제를 쓰지 않는다는 뜻이며, 전해질을 쓰지 않는다는 뜻은 아닙니다.", "세탁기의 교반·급배수 등 기계 구성은 기존 제품을 그대로 쓰고, 전해 모듈과 전해질 공급만 추가됩니다.", "용도(세정·살균·탈취 등)에 따라 전극을 달리 설계합니다."], "prod": ["가정용 무세제 세탁기 (세탁기 내장형)", "업소·산업용 무세제 세탁수 생성장치 (외부 공급형, 한 대로 여러 세탁기에 연결)", "주방용 무세제 세정수 생성장치 (싱크대 설치형)", "무세제 식기세척기 (가정용 및 연속식)", "세탁수 파우치 「워터루(Wateru)」", "기동형 세탁장비 탑재용 세정수 장치 (의뢰·개념 설계 단계)", "그 밖의 응용 제안: 식품 설비 세척(CIP), 세차, 섬유 염색·정련"], "contact": ["세제 없는 세탁과 세정에 관심이 있으신가요? 적용 환경(가정·업소·세탁공장·급식 등)과 필요한 물의 양을 알려 주시면 기술팀이 검토 후 회신드리겠습니다."]}, {"tag": "원자력 시설 작업복을 세제 없이 세탁하는 장비.", "prob": ["원자력 시설의 작업복 세탁에는 합성세제가 쓰이고, 세제가 섞인 세탁폐수는 증발농축 등 후단 처리 과정에서 거품을 일으켜 처리 효율을 떨어뜨리는 것으로 알려져 있습니다. 경원엔터프라이즈는 합성세제 대신 전해 세정수로 세탁하는 방식을 제안합니다. 이 세정수 생성장치를 기존 세탁기의 세제 투입 라인에 연결하는 구성이어서, 세탁기 자체를 바꾸지 않는 방향으로 설계하고 있습니다. 한국원자력연구소(현 한국원자력연구원)와의 공동연구를 거친 기술이며, 현장 적용은 시설별 조건 확인과 협의를 전제로 합니다."], "how": ["전해셀에서 물을 전기분해해 세정용 전해수를 만듭니다. 셀은 양극실·음극실과 그 사이의 양이온 교환막으로 구성됩니다.", "이 전해수를 세탁기의 세제 투입 라인으로 보내, 합성세제 없이 작업복을 세탁합니다.", "세제 성분이 없으므로 세탁폐수의 거품 발생을 줄여 후단 처리 부담을 낮추는 것이 목적입니다.", "오염 물질은 사라지는 것이 아니라 세탁수·필터·잔사 등으로 옮겨 가므로, 세탁과 폐액 처리를 하나의 흐름으로 관리해야 합니다."], "prod": ["방사성 오염 피복 등 세척 장치 (전해 세정수 생성장치 + 기존 세탁기 연결 구성)", "세탁폐수의 후단 처리 연계 검토: 03 폐수 처리와 물 재이용 참조", "기동형 세탁 차량: 개념 설계 단계 (원자력 외 군·재난 구호용 구상)"], "contact": ["원자력 시설의 작업복 세탁과 세탁폐수 관리에 대해 문의해 주세요. 시설 조건을 알려 주시면 적용 가능성을 함께 검토하겠습니다."]}, {"tag": "전해산화로 오·폐수를 처리하고 중수로 되살립니다.", "prob": ["난분해성 유기물, 질소, 색도가 포함된 폐수는 기존 약품 처리만으로는 부담이 크고, 처리한 물을 다시 쓰려면 후단 처리가 더해져야 합니다. 경원엔터프라이즈는 자체 개발한 KW-DSA 전극을 양극으로 쓰는 전해산화 방식으로 이 문제에 접근합니다. 전기를 산화제로 사용하므로 약품에 의존하는 정도를 줄일 수 있다는 것이 회사의 설명입니다. 같은 기술을 중수도(워터 리사이클링) 시스템의 후단 공정으로 배치해, 처리수를 화장실·청소·조경·냉각·공정용수로 다시 쓰는 구성을 제안합니다."], "how": ["치수안정성 전극(DSA)을 양극으로 사용하고, 직류 전원으로 전해산화 반응을 일으킵니다.", "폐수 속 오염물이 양극에서 직접 산화되거나, 양극에서 생성된 산화종과 반응해 분해됩니다.", "질소(암모니아)는 양극에서 직접 산화되거나 생성된 차아염소산 이온을 통한 간접 산화로 처리하는 경로가 있습니다.", "양극 영역의 잔류염소와 높은 산화 전위로 후단 살균을 겸하는 것이 회사의 설명입니다.", "폐수 성상에 맞춰 전극과 시스템을 설계하며, 중수도에서는 여과 후 전해산화, 중수 저장, 용도별 공급 순으로 구성합니다."], "prod": ["전해산화 오·폐수 처리 시스템 (현장별 설계)", "중수도(워터 리사이클링) 시스템", "이동형 컨테이너 파일럿 설비 (현장 테스트용)", "방사성 폐액 처리 연계: 02 사업과 연결 가능성 검토 단계"], "contact": ["폐수 성상과 처리 목표, 재이용 용도를 알려 주세요. 필요하면 파일럿 설비로 현장 시험을 협의해 적합성을 함께 확인하겠습니다."]}, {"tag": "물을 전기분해해 만드는 살균수를 위생 현장에 적용합니다.", "prob": ["살균과 위생 관리에는 화학 소독제를 반복해서 사용하는 부담이 따릅니다. 경원엔터프라이즈는 수십 년의 전해 기술 연구를 바탕으로, 일반 물을 촉매전극으로 전기분해해 산화성 성분을 가진 살균수를 만드는 방식을 개발해 왔습니다. 이 물은 현장에서 생성하거나 파우치·스프레이·물티슈 형태로 쓸 수 있고, 급수관에 연결하는 시설 응용으로도 확장됩니다. 용도에 따라 물의 성질과 구성이 다르므로, 적용 전에 목적과 조건에 맞는 검토를 함께 진행합니다."], "how": ["일반 물(수돗물 등)을 다성분계 촉매전극으로 전기분해합니다.", "전기분해 과정에서 산화력을 가진 성분이 생성되어 살균에 작용합니다.", "전극의 성분과 제조 방식에 따라 생성수의 기능(세정·살균·탈취 등)이 달라집니다.", "용도별로 전극 조성과 운전 조건을 달리 설계합니다."], "prod": ["현장 생성 장치와 살균수기: 가정용, 업소용, 산업용", "포장형 제품: 살균수 파우치·스프레이, 살균 물티슈, 살균소독제", "시설 응용: 기능성 분수, 냉각탑·수영장·비데 등 급수관 연결 방식", "농업·선박 등 기타 응용 (제안 단계)", "모델명·사양·가격은 별도 문의"], "contact": ["적용하실 현장과 용도를 알려주시면 적합한 구성과 검토 절차를 안내해 드리겠습니다."]}, {"tag": "전해 탈취수로 악취와 실내 공기 오염을 줄이는 설비입니다.", "prob": ["축사·퇴비장·매립장·식품 공장 등에서는 암모니아와 황 화합물 같은 악취가 지속적인 민원과 작업 환경 문제로 이어집니다. 신축 건물의 실내 공기에서는 포름알데히드와 휘발성 유기화합물(TVOC)이 문제가 됩니다. 경원엔터프라이즈는 수십 년의 전해 기술 연구를 바탕으로, 물을 촉매전극으로 전기분해해 얻은 탈취수를 악취원이나 실내 공간에 분무하는 설비를 설계해 왔습니다. 설비 형태는 현장의 조건에 맞춰 선택합니다."], "how": ["물을 다성분계 촉매전극으로 전기분해해 산화성 기능수(탈취수)를 만듭니다.", "탈취수의 산화 성분이 악취 물질과 반응해 분해합니다.", "같은 기능수가 살균에도 쓰입니다.", "별도의 화학약품 투입 없이 물을 원료로 합니다."], "prod": ["안개 분무식 자동 시스템(축사 천장 배관, 타이머 분사)", "수동식 분무 시스템(호스 분무)", "퇴비장용 분무식, 송풍기 결합 탈취탑", "실내 공기 처리(새집증후군 대응 분무 시공)", "현장 조건에 맞춘 설계. 처리 용량·사양은 별도 문의"], "contact": ["악취 발생 장소와 대상 물질, 공간 규모를 알려주시면 적합한 설비 형태를 함께 검토하겠습니다."]}, {"tag": "약품 없이 수조와 수계의 녹조를 관리하는 기술을 개발·검토 중입니다.", "prob": ["분수대 수조나 하천·호소의 물에서는 이끼와 녹조가 생겨 청소와 관리 부담이 이어집니다. 경원엔터프라이즈는 수십 년의 전해 기술 연구를 바탕으로, 약품을 쓰지 않고 이 문제에 접근하는 방법을 연구하고 있습니다. 먼저 살균·탈취수를 순환시키는 기능성 분수의 수조 관리 경험이 있으며, 자연 수계의 녹조는 개발·실증을 협의하는 단계입니다. 적용 대상과 조건은 협의를 통해 함께 정해 나갑니다."], "how": ["촉매전극으로 물을 전기분해해 기능수를 만드는 회사의 전해 기술에 기반합니다.", "기능수를 수조에 순환시키는 방식을 기능성 분수에 적용해 왔습니다.", "자연 수계 적용은 개발·실증 협의 단계로, 구성은 확정되지 않았습니다."], "prod": ["기능성 분수: 살균·탈취수를 순환하는 벽면형 분수 (공기 중 미생물 살균, 냄새 제거, 수분 조절, 산소 발생 기능을 소개)", "녹조 관리 장치: 개발·실증 협의 중 (모델·사양 없음)"], "contact": ["관리하려는 수조나 수계의 종류와 규모를 알려주시면 개발·실증 협의를 함께 시작하겠습니다."]}, {"tag": "전극 촉매·전해질·음극 소재 분야의 연구 이력을 소개합니다.", "prob": ["전지의 성능과 안전성은 전극과 전해질 소재, 그리고 이를 만드는 공정에서 크게 좌우됩니다. 경원엔터프라이즈는 수십 년의 전해 기술 연구에서 쌓은 전극·촉매 경험을 바탕으로, 연료전지 전극 촉매용 금속-카본 복합체, 고체 고분자 전해질, 전지 음극용 탄소복합체 분야에서 연구와 특허 출원을 진행해 왔습니다. 이 페이지는 해당 연구 이력을 소개하는 것이며, 완성 제품이나 양산 사업을 알리는 것은 아닙니다. 구체적인 협력 범위는 문의를 통해 함께 논의합니다."], "how": ["연료전지 전극 촉매: 나노구조의 금속과 탄소를 복합화해 촉매 전극에 쓰는 소재를 연구했습니다.", "고체 고분자 전해질: 가교제와 음이온 수용체를 이용해 고분자 전해질의 이온 전달 특성을 높이는 방향을 연구했습니다.", "전지 음극 소재: 탄소 입자 표면에 실리콘 나노 코팅층을 입히는 플라즈마 스프레이 방식의 복합체 제조법을 연구했습니다.", "이들은 서로 다른 기술 계열이며, 각각 별도의 연구 주제로 다룹니다."], "prod": ["현재 확정된 제품·모델은 없습니다.", "소재·공정 분야의 공동 연구 및 기술 협의"], "contact": ["이차전지 소재·공정 분야의 공동 연구나 기술 협의를 원하시면 문의해 주세요. 담당자가 연구 이력과 협력 가능 범위를 안내해 드립니다."]}, {"tag": "사과·감귤로 발효하는 식물성 유산균 소재", "prob": ["시중 유산균 제품은 대부분 우유 같은 동물성 배지에서 배양되어, 유당불내증이나 알레르기 우려가 따르는 경우가 있습니다. 또한 일반 유산균은 산도가 높은 과일에서는 자라기 어렵다고 알려져 있습니다. 경원엔터프라이즈는 산도가 높은 사과와 감귤에서 배양할 수 있는 Lactobacillus casei 균주를 연구해, 식물성 원료 기반의 발효 소재를 제안합니다. 상품성이 낮은 낙과·등외품을 원료로 활용할 수 있다는 점도 특징입니다. 이 소재의 규격과 효능은 용도별 검증을 거쳐 확정하게 됩니다."], "how": ["사과·감귤 같은 산도가 높은 과일을 발효 원료(배지)로 사용합니다.", "산성 환경에서도 배양되는 것으로 소개된 Lactobacillus casei 균주를 사용합니다.", "우유 대신 과실을 쓰는 식물성 발효 방식입니다.", "발효 후 남는 잔여물은 사료 등으로 활용하는 방안을 검토하고 있습니다."], "prod": ["유산균 균주(원종) 공급 협의", "발효물·분말·과립 등 발효 소재", "유제품·식품 소재 및 건강 보조 식품 적용 협의", "발효 잔여물의 사료 원료 활용 검토"], "contact": ["균주 공급, 발효 소재 개발, 공동 연구에 관심이 있으시면 문의해 주세요. 용도와 요구 규격을 알려 주시면 가능한 협력 방식을 안내해 드립니다."]}, {"tag": "미생물 발효로 만드는 천연 당알코올 만니톨", "prob": ["만니톨은 식품, 의약 원료, 치약, 화장품, 소재 등에 쓰이는 당알코올입니다. 산업적으로는 포도당의 촉매 반응 등 화학 합성으로 만드는 경우가 많은데, 이 방식은 정제 부담과 촉매 잔류 우려, 폐기물 문제가 따르고 천연 원료를 선호하는 수요와도 맞지 않습니다. 경원엔터프라이즈는 김치에서 분리한 Leuconostoc citreum KW39 균주를 이용해 과당으로부터 만니톨을 발효로 만드는 방법을 연구하고 특허를 출원한 바 있습니다. 현재는 균주와 공정 기술을 바탕으로 원료 공급, 균주 라이선스, 공동 개발을 협의하는 단계입니다."], "how": ["김치에서 분리·동정한 Leuconostoc citreum KW39 균주를 사용합니다.", "과당을 원료로, 효모추출물과 무기염을 넣은 배지에서 발효합니다.", "온도와 pH를 조절하는 회분식 발효로 만니톨을 생성합니다.", "발효액에서 만니톨을 분리·정제해 원료로 만드는 공정입니다.", "효소를 따로 정제하지 않고 살아 있는 균체를 이용하는 방식입니다."], "prod": ["천연 발효 만니톨 원료 공급 협의", "균주 라이선스 및 공정 기술 협의", "용도별(식품·의약 원료·화장품 등) 공동 개발"], "contact": ["천연 만니톨 원료, 균주 라이선스, 공동 개발에 관심이 있으시면 문의해 주세요. 목표 용도와 필요한 규격을 알려 주시면 협력 방식을 안내해 드립니다."]}, {"tag": "공항용 보안 검색 장치를 설계·개발해 온 이력", "prob": ["공항과 주요 시설의 보안 검색에는 반입 금지 물품을 정확하고 빠르게 가려내는 장비가 필요합니다. 경원엔터프라이즈는 중성자를 이용한 보안 검색 장치를 설계·개발해 온 이력이 있으며, 원자력 분야 경력을 가진 연구진이 이 영역을 다뤄 왔습니다. 현재 이 페이지는 제품 소개가 아니라 개발 이력의 소개이며, 구체적인 적용 대상과 사양은 협의를 통해 정합니다."], "how": ["중성자를 이용해 검사 대상을 비파괴로 검색하는 장치 개념입니다.", "자료에는 중성자 발생·검출·검색 시스템의 구체적 구성이 서술되어 있지 않아, 상세 원리는 협의 시 안내합니다."], "prod": ["확정된 제품 모델은 없습니다.", "중성자 검색 장치의 설계·개발 협의"], "contact": ["중성자 기반 검색 장치의 설계·개발 협력을 원하시면 문의해 주세요. 목적과 환경을 알려 주시면 검토 가능한 범위를 안내해 드립니다."]}, {"tag": "작은 입자의 눈꽃 빙수를 만드는 기기", "prob": ["빙수의 식감은 얼음 입자의 크기와 질에 크게 좌우됩니다. 경원엔터프라이즈는 작은 입자의 질 좋은 눈꽃 빙수를 만드는 것을 목표로 한 눈꽃 빙수기(설빙기)를 소개해 왔습니다. 이 페이지는 기기의 개요를 안내하며, 모델과 세부 사양은 확정 후 별도로 안내합니다. 도입을 검토하시는 경우 문의를 통해 현재 공급 가능한 구성을 확인해 주세요."], "how": ["작은 입자의 눈꽃 형태 얼음을 만드는 것을 목표로 하는 기기입니다.", "자료에는 작동 방식(냉각·분쇄 구조)이 서술되어 있지 않아, 상세 원리는 협의 시 안내합니다."], "prod": ["눈꽃 빙수기(설빙기): 모델·사양은 확정 후 안내", "도입 상담"], "contact": ["눈꽃 빙수기 도입을 검토하신다면 문의해 주세요. 사용 환경과 필요 용량을 알려 주시면 안내해 드립니다."]}], "en": [{"tag": "Electrolyzed cleaning water that washes without synthetic detergent.", "prob": ["Synthetic detergents used for laundry and dishwashing end up in wastewater and place a burden on the environment, and residues on skin are a common concern. Building on decades of research in electrolysis, Kyungwon Enterprise developed a device that electrolyzes tap or ground water into alkaline cleaning water. Using this water in place of detergent makes it possible to wash and launder without synthetic detergent. The device can be built into a washing machine or dishwasher, or installed outside existing equipment to supply the water."], "how": ["Water is electrolyzed using a multi-component catalytic electrode (DSA) and a DC power supply.", "A small amount of electrolyte (sodium carbonate) is added to the water, which then passes through an electrolytic cell to produce alkaline cleaning water.", "This cleaning water removes soils in place of detergent. \"Detergent-free\" means no synthetic detergent is used; it does not mean no electrolyte is used.", "The washer's mechanical system (agitation, water supply and drainage) stays as in a conventional machine; only the electrolytic module and electrolyte supply are added.", "Electrodes are designed separately for each purpose, such as cleaning, disinfection and deodorization."], "prod": ["Detergent-free washing machines for home use (built-in type)", "Detergent-free washing-water generators for commercial and industrial use (external-supply type; one unit can serve multiple washers)", "Detergent-free cleaning-water generator for kitchens (sink-mounted type)", "Detergent-free dishwashers (household and continuous-type)", "Washing-water pouch \"Wateru\"", "Cleaning-water unit for mobile laundry equipment (request and concept-design stage)", "Other proposed applications: clean-in-place (CIP) of food equipment, car washing, textile dyeing and scouring"], "contact": ["Interested in detergent-free laundry and cleaning? Tell us about your setting (home, commercial, laundry plant, catering, etc.) and the volume of water you need, and our technical team will review and reply."]}, {"tag": "Detergent-free laundry equipment for nuclear facility garments.", "prob": ["Synthetic detergents are used to launder work clothing at nuclear facilities, and detergent in the laundry wastewater is known to cause foaming in downstream treatment such as evaporation and concentration, lowering treatment efficiency. Kyungwon Enterprise proposes laundering with electrolyzed cleaning water instead of synthetic detergent. The cleaning-water generator connects to the detergent feed line of an existing washing machine, so the approach is designed not to require replacing the machine itself. The technology was developed through joint research with the Korea Atomic Energy Research Institute, and on-site application is subject to confirmation of each facility's conditions and consultation."], "how": ["Water is electrolyzed in an electrolytic cell to produce electrolyzed water for cleaning. The cell consists of an anode compartment, a cathode compartment and a cation exchange membrane between them.", "This water is fed into the washing machine's detergent feed line to launder work clothing without synthetic detergent.", "Because no detergent is present, the aim is to reduce foaming in the laundry wastewater and ease the burden on downstream treatment.", "Contaminants are transferred, not eliminated: they move to wash water, filters and residues, so laundering and liquid-waste treatment need to be managed as one flow."], "prod": ["Washing equipment for radioactively contaminated work clothing (electrolyzed cleaning-water generator connected to an existing washing machine)", "Review of downstream treatment of laundry wastewater: see 03 Wastewater Treatment and Water Reuse", "Mobile laundry vehicle: concept-design stage (for non-nuclear military and disaster-relief use)"], "contact": ["Please contact us about work-clothing laundry and laundry-wastewater management at your nuclear facility. Share your site conditions and we will review applicability together."]}, {"tag": "Electro-oxidation for wastewater treatment and water recycling.", "prob": ["Wastewater containing refractory organics, nitrogen and color is costly to treat with chemical methods alone, and reusing the treated water requires further downstream treatment. Kyungwon Enterprise approaches this with electro-oxidation, using its in-house KW-DSA electrode as the anode. According to the company, because electricity serves as the oxidant, reliance on chemicals can be reduced. The same technology is positioned as a downstream step in a water recycling system, so that treated water can be reused for toilet flushing, cleaning, landscaping, cooling and process water."], "how": ["A dimensionally stable anode (DSA) serves as the anode, and a DC power supply drives the electro-oxidation reaction.", "Pollutants in the wastewater are oxidized directly at the anode or broken down by oxidizing species generated at the anode.", "Nitrogen (ammonia) can be treated by direct oxidation at the anode or by indirect oxidation through hypochlorite ions generated there.", "According to the company, residual chlorine and a high oxidation potential in the anode zone also provide disinfection as a final step.", "Electrodes and systems are designed to suit the wastewater; in water recycling, the flow is filtration, electro-oxidation, reclaimed-water storage and supply by use."], "prod": ["Electro-oxidation wastewater treatment systems (designed per site)", "Water recycling systems (reclaimed-water systems)", "Containerized mobile pilot unit (for on-site testing)", "Link to radioactive liquid waste treatment: under review as a possible extension of Business 02"], "contact": ["Tell us about your wastewater characteristics, treatment goals and intended reuse. If needed, we can discuss on-site testing with a pilot unit to confirm suitability together."]}, {"tag": "Electrolytic sterilizing water for hygiene and facility use.", "prob": ["Sanitation and hygiene control often depend on the repeated use of chemical disinfectants. Building on decades of research in electrolytic technology, Kyungwon Enterprise has developed a method that electrolyzes ordinary water with a catalytic electrode to produce sterilizing water containing oxidizing species. The water can be generated on site, supplied in pouch, spray or wipe formats, or applied to facilities by connecting to water supply lines. Because the properties and configuration of the water differ by application, we review the purpose and conditions together with the customer before deployment."], "how": ["Ordinary water (such as tap water) is electrolyzed with a multi-component catalytic electrode.", "The electrolysis generates oxidizing species that act on microorganisms.", "The function of the water (cleaning, sterilization, deodorization, etc.) depends on the electrode composition and manufacturing method.", "Electrode composition and operating conditions are designed separately for each application."], "prod": ["On-site generators and sterilizing water dispensers: household, commercial and industrial", "Packaged products: sterilizing water pouches and sprays, sterilizing wipes, disinfectant", "Facility applications: functional fountains; cooling towers, pools and bidets connected to water lines", "Other applications such as agriculture and marine use (proposal stage)", "Models, specifications and pricing available on request"], "contact": ["Tell us about your site and intended use, and we will guide you on a suitable configuration and review process."]}, {"tag": "Electrolytic deodorizing water systems for odor and indoor air.", "prob": ["Odors such as ammonia and sulfur compounds at livestock houses, compost yards, landfills and food plants lead to ongoing complaints and workplace issues, and formaldehyde and volatile organic compounds (TVOC) affect indoor air in newly built spaces. Building on decades of research in electrolytic technology, Kyungwon Enterprise has designed systems that spray deodorizing water, produced by electrolyzing water with a catalytic electrode, onto odor sources or indoor spaces. The system type is selected to suit site conditions."], "how": ["Water is electrolyzed with a multi-component catalytic electrode to produce oxidizing functional water (deodorizing water).", "Oxidizing species in the water react with and break down odor compounds.", "The same functional water is also used for sterilization.", "The process uses water as the raw material, without adding separate chemicals."], "prod": ["Automatic fog-spray system (ceiling piping with timer-controlled spraying) for livestock houses", "Manual spray system (hose spraying)", "Spray systems for compost yards and deodorizing towers combined with blowers", "Indoor air treatment (spray application for sick-building-syndrome concerns in new buildings)", "Designed to site conditions; capacity and specifications on request"], "contact": ["Share the odor source, target compounds and the size of the space, and we will review a suitable system type together."]}, {"tag": "Chemical-free algae management for tanks and waterways, under development.", "prob": ["Moss and algae in fountain basins, rivers and lakes create ongoing cleaning and maintenance burdens. Building on decades of research in electrolytic technology, Kyungwon Enterprise is studying ways to address this without chemicals. We have experience with functional fountains that circulate sterilizing and deodorizing water in the basin, while algae management in natural waters is at the stage of development and demonstration discussions. The target and conditions are defined together through consultation."], "how": ["Based on the company's electrolytic technology, which produces functional water by electrolyzing water with a catalytic electrode.", "Circulating functional water through the basin has been applied in functional fountains.", "Application to natural waters is at the development and demonstration discussion stage; the configuration is not yet defined."], "prod": ["Functional fountain: wall-type fountain that circulates sterilizing and deodorizing water (described as providing airborne microbe sterilization, odor removal, humidity control and oxygen generation)", "Algae management system: under development and demonstration discussions (no model or specification yet)"], "contact": ["Tell us the type and scale of the tank or waterway, and we can begin development and demonstration discussions together."]}, {"tag": "A research record in electrode catalysts, electrolytes and anode materials.", "prob": ["Battery performance and safety depend heavily on electrode and electrolyte materials and on the processes used to make them. Building on decades of electrochemical research, Kyungwon Enterprise has carried out research and patent filings on metal-carbon composites for fuel cell electrode catalysts, solid polymer electrolytes, and carbon composites for battery anodes. This page introduces that research record; it does not announce a finished product or mass production. The scope of any collaboration is discussed on inquiry."], "how": ["Fuel cell electrode catalysts: research on nanostructured metal-carbon composites for use in catalytic electrodes.", "Solid polymer electrolytes: research on improving ion transport in polymer electrolytes using crosslinkers and anion receptors.", "Battery anode materials: research on a plasma spray method that forms a nano-scale silicon coating on carbon particles to make a composite.", "These are distinct technology lines, each treated as a separate research topic."], "prod": ["No finalized product or model is offered at this time.", "Joint research and technical consultation on materials and processes"], "contact": ["To discuss joint research or technical consultation on battery materials and processes, please contact us. Our team will walk you through our research record and possible areas of collaboration."]}, {"tag": "Plant-based lactic acid bacteria fermented on apples and citrus.", "prob": ["Most commercial lactic acid bacteria products are cultured on animal-based media such as milk, which can raise concerns for people with lactose intolerance or allergies. Conventional lactic acid bacteria are also generally considered difficult to grow in highly acidic fruit. Kyungwon Enterprise has studied a Lactobacillus casei strain that can be cultured on acidic apples and citrus, and proposes plant-based fermentation materials built on it. Fruit unsuitable for retail, such as windfalls and off-grade produce, can serve as raw material. Specifications and functionality will be confirmed through validation for each intended use."], "how": ["Acidic fruit such as apples and citrus is used as the fermentation substrate.", "The process uses a Lactobacillus casei strain reported to grow in acidic conditions.", "It is a plant-based fermentation that uses fruit instead of milk.", "Use of the post-fermentation residue, for example as feed, is under consideration."], "prod": ["Strain (seed culture) supply discussions", "Fermentation materials such as fermented product, powder and granules", "Application discussions for dairy, food ingredients and dietary supplements", "Evaluation of fermentation residue as a feed ingredient"], "contact": ["If you are interested in strain supply, fermentation material development or joint research, please contact us. Tell us your intended use and required specifications, and we will outline possible ways to work together."]}, {"tag": "A natural sugar alcohol, mannitol, produced by microbial fermentation.", "prob": ["Mannitol is a sugar alcohol used in foods, pharmaceutical ingredients, toothpaste, cosmetics and materials. It is often made industrially by chemical synthesis such as catalytic conversion of glucose, which brings purification burdens, concerns about residual catalyst and waste, and does not meet demand for natural ingredients. Kyungwon Enterprise researched a method of producing mannitol by fermenting fructose with Leuconostoc citreum KW39, a strain isolated from kimchi, and has filed a patent on it. We are now discussing ingredient supply, strain licensing and joint development based on this strain and process know-how."], "how": ["The process uses Leuconostoc citreum KW39, a strain isolated from kimchi and identified.", "Fructose is fermented in a medium containing yeast extract and mineral salts.", "Mannitol is produced in batch fermentation under controlled temperature and pH.", "Mannitol is then separated and purified from the broth into an ingredient.", "The method uses whole cells rather than purified enzymes."], "prod": ["Supply discussions for fermentation-derived natural mannitol", "Strain licensing and process technology discussions", "Joint development by application (food, pharmaceutical ingredient, cosmetics, etc.)"], "contact": ["If you are interested in natural mannitol ingredients, strain licensing or joint development, please contact us. Tell us your target application and required specifications, and we will outline how we can work together."]}, {"tag": "A design and development record in airport security screening equipment.", "prob": ["Security screening at airports and critical facilities requires equipment that can identify prohibited items accurately and quickly. Kyungwon Enterprise has a record of designing and developing neutron-based security screening equipment. This page presents that development record rather than a product; target applications and specifications are defined through discussion."], "how": ["The concept is a screening device that inspects objects non-destructively using neutrons.", "Source materials do not describe the configuration of the neutron generation, detection or screening system, so details are provided on inquiry."], "prod": ["No finalized product model is offered at this time.", "Design and development consultation for neutron-based screening equipment"], "contact": ["To discuss collaboration on the design and development of neutron-based screening equipment, please contact us. Share your purpose and operating environment, and we will outline what we can evaluate."]}, {"tag": "A machine that makes fine-grained snow-flake shaved ice.", "prob": ["The texture of shaved ice depends largely on the size and quality of the ice particles. Kyungwon Enterprise has presented a snow-flake ice shaver (Seolbing machine) aimed at producing fine, high-quality snow-flake shaved ice. This page gives an overview only; models and detailed specifications will be provided separately once confirmed. If you are considering adoption, please inquire to confirm the configurations currently available."], "how": ["The machine is designed to produce ice in fine snow-flake form.", "Source materials do not describe the operating mechanism (cooling and shaving structure), so details are provided on inquiry."], "prod": ["Snow-flake ice shaver (Seolbing machine): model and specifications to be announced", "Adoption consultation"], "contact": ["If you are considering a snow-flake ice shaver, please contact us. Tell us your operating environment and required capacity, and we will advise you."]}]};

function bindPartners(){

 const step=ts=>{if(!m.isConnected){cancelAnimationFrame(raf);return}
  const dt=last?Math.min(64,ts-last):16;last=ts;const W=tracks[0].offsetWidth;
  let v=(paused||hover)?0:.04*dt;if(nudge){const d=nudge*.18;v+=d;nudge-=d;if(Math.abs(nudge)<.5)nudge=0}
  x=(x+v)%W;if(x<0)x+=W;tracks.forEach(t=>t.style.transform=`translateX(${-x}px)`);raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step);
 m.onmouseenter=()=>hover=true;m.onmouseleave=()=>hover=false;
 m.addEventListener('focusin',()=>hover=true);m.addEventListener('focusout',()=>hover=false);
 const one=()=>m.querySelector('.pt').offsetWidth;
 $('#pnext').onclick=()=>{nudge+=one()};$('#pprev').onclick=()=>{nudge-=one()};
 pp.onclick=()=>{paused=!paused;label()};
 let sx=null;m.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;hover=true},{passive:true});
 m.addEventListener('touchend',e=>{if(sx!=null){const d=sx-e.changedTouches[0].clientX;if(Math.abs(d)>30)nudge+=d>0?one():-one()}sx=null;hover=false});
}

/* hero motion: Unsplash photo of stainless process equipment, slow camera push and drift with a light sweep across the steel */
let HA=null;
const HIMG=new Image();HIMG.src='../img/hero.jpg';
function heroMotion(){
 const cv=$('#hc');if(!cv)return;
 if(HA)cancelAnimationFrame(HA.raf);
 const ctx=cv.getContext('2d');const st={raf:0,paused:false,t:0,ox:0,oy:0,tx:0,ty:0};HA=st;
 const hs=cv.closest('.hero');if(hs&&matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){hs.onpointermove=e=>{const r=hs.getBoundingClientRect();st.tx=(e.clientX-r.left)/r.width-.5;st.ty=(e.clientY-r.top)/r.height-.5};hs.onpointerleave=()=>{st.tx=0;st.ty=0}}
 let w=0,h=0,dpr=1;
 const size=()=>{dpr=Math.min(2,window.devicePixelRatio||1);w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
 size();
 const draw=()=>{
  const t=st.t;
  ctx.fillStyle=getComputedStyle(document.body).backgroundColor;ctx.fillRect(0,0,w,h);
  if(HIMG.complete&&HIMG.naturalWidth){
   const p=(Math.sin(t*.05-1.57)+1)/2; // 0..1 over ~2 min, eased
   const z=1.06+.1*p;
   const iw=HIMG.naturalWidth,ih=HIMG.naturalHeight;
   const base=Math.max(w/iw,h/ih)*z;const dw=iw*base,dh=ih*base;
   const fx=.62-.12*p,fy=.45+.05*Math.sin(t*.07);
   st.ox+=(st.tx-st.ox)*.05;st.oy+=(st.ty-st.oy)*.05;
   const x=(w-dw)*fx-st.ox*w*.016,y=(h-dh)*fy-st.oy*h*.02;
   ctx.drawImage(HIMG,x,y,dw,dh);
   // cool steel grade toward the site's teal
   ctx.globalCompositeOperation='soft-light';ctx.fillStyle='rgba(140,79,0,.3)';ctx.fillRect(0,0,w,h);
   
   // light sweep across the steel
   ctx.globalCompositeOperation='screen';
   const s=((t*.06)%1.6)-.3;const sx=w*s;
   const lg=ctx.createLinearGradient(sx-w*.25,0,sx+w*.25,h*.6);
   lg.addColorStop(0,'rgba(240,188,120,0)');lg.addColorStop(.5,'rgba(240,188,120,.14)');lg.addColorStop(1,'rgba(240,188,120,0)');
   ctx.fillStyle=lg;ctx.fillRect(0,0,w,h);
   ctx.globalCompositeOperation='source-over';
  }
  const vg=ctx.createRadialGradient(w*.65,h*.5,h*.2,w*.65,h*.5,Math.max(w,h)*.8);vg.addColorStop(0,'rgba(17,16,14,0)');vg.addColorStop(1,'rgba(17,16,14,0)');ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
 };
 HIMG.onload=()=>{if(cv.isConnected)draw()};
 const loop=()=>{if(!cv.isConnected){cancelAnimationFrame(st.raf);return}if(!st.paused)st.t+=.016;draw();st.raf=requestAnimationFrame(loop)};
 window.addEventListener('resize',()=>{if(cv.isConnected){size();draw()}});
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const vc=$('#vc');const set=p=>{st.paused=p;vc.textContent=p?U().play:U().pause};
 vc.onclick=()=>set(!st.paused);
 if(reduce){set(true)}
 loop();
}
